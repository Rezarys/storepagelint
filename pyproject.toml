[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storepagelint"
version = "0.1.0"
description = "Check whether a game store page says its genre, and where a reader finds it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Younes Z." }]
keywords = [
  "game development",
  "store page",
  "marketing copy",
  "linter",
  "genre",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Rezarys/storepagelint"
Issues = "https://github.com/Rezarys/storepagelint/issues"

[project.scripts]
storepagelint = "storepagelint.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
